[project]
name = "vikunja-mcp"
version = "0.2.48"
description = "Workflow-level MCP server for Vikunja: queue -> claim -> design -> build -> review with enforced gates"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Upper bounds are LOAD-BEARING here, not hygiene. Consumers launch us via
# `uvx --from git+...@stable`, which re-resolves from THIS list and ignores uv.lock —
# so the lock protects CI and the local .venv, and protects nobody in production.
# mcp 2.0.0 (2026-07-28) removed `mcp.server.fastmcp`; every consumer's server died on
# import with "Connection closed" while tests stayed green on the locked 1.28.1.
# Pin the majors of anything imported at module scope, and verify a release the way a
# consumer starts it: uvx --refresh-package vikunja-mcp --from git+...@stable vikunja-mcp --version
dependencies = ["mcp>=2,<3", "httpx>=0.27,<1"]

[project.scripts]
vikunja-mcp = "vikunja_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vikunja_mcp"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
